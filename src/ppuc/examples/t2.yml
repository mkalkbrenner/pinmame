description: "T2 example configuration"
ppucVersion: 1
rom: t2_l8
serialPort: /dev/tty.usbserial-1420
display: pin2dmd
debug: false

boards:
  -
    description: "IO board 0, sends switch events"
    number: 0
    pollEvents: true
  -
    description: "IO board 3, doesn't send switch events"
    number: 3
    pollEvents: false

lamps:
  ledType: GBRW
  lightUp: 100
  afterGlow: 400
  assignment:
    -
      description: "one million, LED 1"
      number: 14
      ledNumber: 27
      brightness: 128
      color: 000000FF
    -
      description: "one million, LED 2"
      number: 14
      ledNumber: 28
      brightness: 128
      color: 000000FF
    -
      description: "Bonus"
      number: 13
      ledNumber: 28
      brightness: 196
      color: FF00FF00

flasher:
  ledType: RGB
  lightUp: 100
  afterGlow: 400
  assignment:
    -
      description: "describe the flasher here"
      number: 7
      ledNumber: 13
      brightness: 255
      color: FFFFFF

switches:
  -
    number: 1
    board: 0
    port: 13
  -
    number: 2
    board: 0
    port: 14

coils:
  -
    description: "left slingshot"
    number: 17
    board: 3
    port: 5
    power: 255
    minPulseTime: 100
    maxPulseTime: 500

mechs:
  -
    description: "canon"
    number: 0
    board: 4
    port: 8
